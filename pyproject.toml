[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfuzz"
version = "0.1.0"
description = "ChainFuzzer-Lite: automated tool-chain injection testing for LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "langgraph>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
