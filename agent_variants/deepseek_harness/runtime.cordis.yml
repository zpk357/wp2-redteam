# H1 feasibility composition. Stdout belongs exclusively to JSON-RPC.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-office-local
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      office-local:
        displayName: Office local model
        apiKeyEnv: DSH_PROBE_API_KEY
        api: openai-completions
        baseURL: !!js process.env.DSH_MODEL_BASE_URL
        streamIdleTimeoutMs: 10000
        models:
          - id: qwen3.5:27b-q4_K_M
            name: Qwen 3.5 27B local
            contextWindow: 8192
            maxTokens: 1024

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: You are an assistant operating a synthetic Office workspace.
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: office-probe-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: office_probe
    transport: stdio
    command: node
    args:
      - fixtures/mcp_server.mjs
    cwd: !!js process.env.DSH_VARIANT_ROOT
    toolCallTimeoutMs: 5000
    failOnStartupError: true
    reconnect:
      enabled: false

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'
